<div class="filter-sidebar p-3 border-end">
  <!-- العنوان الرئيسي للفلتر -->
  <h4 class="mb-4 fw-bold main-filter-title">Filter</h4>
  
  <!-- قسم Product Type -->
  <div class="filter-section mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3 pointer" 
         data-bs-toggle="collapse" data-bs-target="#productType" aria-expanded="true">
      <h6 class="fw-bold m-0">Product type</h6>
      <i class="bi bi-chevron-up"></i>
    </div>
    
    <div class="collapse show" id="productType">
      <div class="form-check mb-2">
        <input class="form-check-input custom-checkbox" type="checkbox" id="acc">
        <label class="form-check-label ms-2" for="acc">Accessories <span class="count-text">(5)</span></label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input custom-checkbox" type="checkbox" id="diam">
        <label class="form-check-label ms-2" for="diam">Diamond <span class="count-text">(4)</span></label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input custom-checkbox" type="checkbox" id="gold">
        <label class="form-check-label ms-2" for="gold">Gold <span class="count-text">(3)</span></label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input custom-checkbox" type="checkbox" id="neck">
        <label class="form-check-label ms-2" for="neck">Necklace <span class="count-text">(2)</span></label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input custom-checkbox" type="checkbox" id="pend">
        <label class="form-check-label ms-2" for="pend">Pendant <span class="count-text">(4)</span></label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input custom-checkbox" type="checkbox" id="rings">
        <label class="form-check-label ms-2" for="rings">Rings <span class="count-text">(4)</span></label>
      </div>
    </div>
  </div>

  <!-- قسم Brand -->
  <div class="filter-section">
    <div class="d-flex justify-content-between align-items-center mb-3 pointer" 
         data-bs-toggle="collapse" data-bs-target="#brandList" aria-expanded="true">
      <h6 class="fw-bold m-0">Brand</h6>
      <i class="bi bi-chevron-up"></i>
    </div>
    
    <div class="collapse show" id="brandList">
      <div class="form-check mb-2">
        <input class="form-check-input custom-checkbox" type="checkbox" id="bell">
        <label class="form-check-label ms-2" for="bell">Bellagio Jewelers <span class="count-text">(3)</span></label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input custom-checkbox" type="checkbox" id="florida">
        <label class="form-check-label ms-2" for="florida">Florida Diamond <span class="count-text">(6)</span></label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input custom-checkbox" type="checkbox" id="goldring">
        <label class="form-check-label ms-2" for="goldring">Gold Ring <span class="count-text">(4)</span></label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input custom-checkbox" type="checkbox" id="junky">
        <label class="form-check-label ms-2" for="junky">Junky Jewel <span class="count-text">(3)</span></label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input custom-checkbox" type="checkbox" id="miss">
        <label class="form-check-label ms-2" for="miss">Miss Curious <span class="count-text">(3)</span></label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input custom-checkbox" type="checkbox" id="reclaim">
        <label class="form-check-label ms-2" for="reclaim">Reclaim Artsy <span class="count-text">(3)</span></label>
      </div>
    </div>
  </div>
</div>
